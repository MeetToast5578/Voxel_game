name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/benchmark.mjs --assert

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser comes from Playwright's own download; its system packages come from the Ubuntu mirrors, which are
      # sometimes unreachable from the runner. The runner image already has what Chromium needs, so that step may fail.
      - run: npx playwright install chromium
      - run: timeout 300 npx playwright install-deps chromium || echo "Ubuntu mirrors unreachable; using the runner's own libraries"
      - run: npm run smoke
      - run: node scripts/playthrough.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: warn
