<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel (new engine)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #game { display: block; width: 100%; height: 100%; }
      #overlay { position: fixed; top: 8px; left: 8px; color: #fff; font: 12px/1.4 monospace; white-space: pre;
        text-shadow: 0 1px 2px #000; pointer-events: none; }
      #crosshair { position: fixed; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; pointer-events: none;
        background: linear-gradient(#fff, #fff) center / 2px 16px no-repeat, linear-gradient(#fff, #fff) center / 16px 2px no-repeat;
        mix-blend-mode: difference; }
      #hotbar { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; color: #fff; font: 13px/1.4 monospace;
        white-space: pre; text-shadow: 0 1px 2px #000; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="overlay">loading…</div>
    <div id="crosshair"></div>
    <div id="hotbar"></div>
    <script type="module" src="/next/main.ts"></script>
  </body>
</html>
